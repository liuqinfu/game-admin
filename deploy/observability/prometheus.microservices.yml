global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080

  - job_name: http-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - identity-service:8081
          - tenant-service:8082
          - agent-service:8083
          - relation-service:8084
          - game-service:8085
          - rule-service:8086
          - activity-service:8087
          - recharge-service:8088
          - settlement-service:8089
          - account-service:8090
          - withdrawal-service:8091
          - risk-service:8092
          - report-service:8093
          - audit-service:8094

  - job_name: workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service:8095
          - data-platform-sync-service:8096
